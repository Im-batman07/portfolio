<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header {
            background-color: #333;
            color: white;
            padding: 1rem;
            text-align: center;
        }
        nav {
            margin: 1rem 0;
        }
        nav a {
            color: white;
            padding: 0.5rem 1rem;
            text-decoration: none;
        }
        /* Base Styles */
        section {
            padding: 1rem;
            margin: 1rem 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }
        h1, h2, h3 {
            margin: 0.5rem 0;
        }
        /* Responsive Styles */
        @media (max-width: 600px) {
            body {
                font-size: 14px;
            }
            nav a {
                display: block;
                margin: 0.5rem 0;
            }
        }
        @media (min-width: 601px) and (max-width: 900px) {
            body {
                font-size: 16px;
            }
            section {
                margin: 1.5rem 0;
            }
        }
        @media (min-width: 901px) and (max-width: 1200px) {
            body {
                font-size: 18px;
            }
            section {
                padding: 2rem;
            }
        }
        @media (min-width: 1201px) {
            body {
                font-size: 20px;
            }
            section {
                padding: 2.5rem;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Welcome to My Portfolio</h1>
        <nav>
            <a href="#about">About</a>
            <a href="#projects">Projects</a>
            <a href="#contact">Contact</a>
        </nav>
    </header>
    <section id="about">
        <h2>About Me</h2>
        <p>This section can include a brief introduction about yourself.</p>
    </section>
    <section id="projects">
        <h2>My Projects</h2>
        <p>Include details about your projects here.</p>
    </section>
    <section id="contact">
        <h2>Contact Me</h2>
        <p>Provide contact details or a form here.</p>
    </section>
</body>
</html>
