<!-- This file includes mew responsive design improvements with media queries for mobile, tablet, and desktop -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        /* Base styles for all devices */
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        header, footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 1em 0;
        }
        main {
            padding: 20px;
        }
        /* Mobile styles */
        @media (max-width: 600px) {
            h1 {
                font-size: 24px;
            }
            p {
                font-size: 14px;
            }
            .container {
                padding: 10px;
            }
        }
        /* Tablet styles */
        @media (min-width: 601px) and (max-width: 900px) {
            h1 {
                font-size: 32px;
            }
            p {
                font-size: 16px;
            }
            .container {
                padding: 15px;
            }
        }
        /* Desktop styles */
        @media (min-width: 901px) {
            h1 {
                font-size: 40px;
            }
            p {
                font-size: 18px;
            }
            .container {
                padding: 20px;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>My Portfolio</h1>
    </header>
    <main>
        <div class="container">
            <p>Welcome to my personal portfolio! Here you'll find all my projects and experiences.</p>
        </div>
    </main>
    <footer>
        <p>&copy; 2026 Im-batman07</p>
    </footer>
</body>
</html>
